<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Class Weapon</title>

<style>

body{
  font-family:sans-serif;
  padding:10px;
  margin:0;
}

h2{
  margin-top:15px;
  font-size:16px;
  border-bottom:1px solid #ccc;
  padding-bottom:4px;
}

textarea,input{
  width:100%;
  margin-top:5px;
  padding:6px;
  box-sizing:border-box;
}

.buttonRow{
  margin-top:5px;
  display:flex;
  gap:10px;
}

.buttonRow button{
  width:150px;
}

#micBtn{
  width:60px;
}

.result{
  background:#f5f5f5;
  padding:6px;
  margin-top:5px;
  min-height:40px;
  border:1px solid #ccc;
}

/* ========================== */
/* タイ語だけ見やすく調整 */
.translated {
  font-size: 1.3em;    /* 少し小さめに */
  font-weight: normal;  /* 太すぎない */
  line-height: 1.3;    /* 詰まりすぎない */
}

.section{
  margin-bottom:20px;
}

.wordRow{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #ddd;
  padding:3px 0;
  cursor:pointer;
}

.header{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.logo{
  width:30px;
  height:auto;
}

h1{
  margin:0;
  font-size:32px;
  font-weight:bold;
}

.resultArea{
  display:flex;
  gap:20px;
  margin-top:15px;
}

.resultBox:first-child{
  flex:6;
}

.resultBox:last-child{
  flex:4;
}

.resultBox h2{
  margin-top:0;
}

.supportTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.langSwitch{
  display:flex;
  gap:6px;
}

.langSwitch button{
  border:1px solid #ccc;
  background:#fff;
  border-radius:6px;
  cursor:pointer;
  padding:2px 8px;
  font-size:16px;
}

.langSwitch button.active{
  background:#4da3ff;
  color:white;
  border-color:#4da3ff;
}

#micBtn.listening{
  background:#ff4d4d;
  color:white;
}

</style>

</head>

<body>

<div class="header">
  <img src="トータルロゴ.png" class="logo">
  <h1>Class Weapon</h1>
</div>

<!-- ===== 授業翻訳 ===== -->
<div class="section">
<h2>授業翻訳</h2>

<select id="targetLang">
  <option value="ja">日本語</option>
  <option value="th" selected>タイ語</option>
  <option value="en">英語</option>
</select>

<textarea id="inputText" placeholder="入力（日本語・ไทย・English）" rows="5"></textarea>

<div class="buttonRow">
  <button id="micBtn">🎤</button>
  <button id="translateBtn">翻訳する</button>
  <button id="clearBtn">クリア</button>
  <button id="speakBtn">🔊 再生</button>
</div>

<div class="resultArea">

  <div class="resultBox">
    <h2>翻訳結果</h2>

    <div class="result" id="translateResult"></div>
  </div>

  <div class="resultBox">
    <h2 class="supportTitle">
      単語サポート

      <span class="langSwitch">
        <button id="jpMode" class="active">🇯🇵</button>
        <button id="thMode">🇹🇭</button>
      </span>

    </h2>
    <div class="result" id="sentenceResult"></div>
  </div>

</div>

</div>
<script src="kuromoji.js"></script>
<script src="panel.js"></script>

</body>
</html>
